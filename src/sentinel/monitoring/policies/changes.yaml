# Change records for the course fleet (synthetic, for course use). Rubric 7.4.
# Every fingerprint in fleet.yaml must match an APPROVED record whose re-validation passed.
# plans: the PCCP-style list of fields each agent may change as a "predetermined" change. A model change is
# never predetermined. To change anything else: open a record, run the suite, get the approvals, then deploy.
