# Lab 6 version of the course repo's compliance CI (rubric 7.1, 7.2, 7.6): same triggers plus the lab folder.
# GitHub only runs workflows from the repository root: copy this file to .github/workflows/ to use it.
# Runs the compliance suite on every change to code, prompts, policies, tools or the fleet manifest, and nightly with
# the red-team corpus. Any failing control fails the build. Results and the evidence pack are kept as artifacts;
# copy them to WORM storage for the full retention period (artifact retention is not a records-retention control).
name: compliance

on:
  pull_request:
    paths: ["src/**", "labs/lab6_continuous-compliance/**", "compliance/**", "pyproject.toml", "uv.lock", ".github/workflows/compliance.yml"]
  push:
    branches: [main]
    paths: ["src/**", "labs/lab6_continuous-compliance/**", "compliance/**", "pyproject.toml", "uv.lock", ".github/workflows/compliance.yml"]
  schedule:
    - cron: "17 6 * * *"          # nightly: full suite + red team, even when nothing changed (models can change)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compliance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: labs/lab6_continuous-compliance/solution
    env:
      AUDIT_HMAC_KEY: ${{ secrets.AUDIT_HMAC_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install
        run: uv sync --extra dev
      - name: Compliance suite (fails the build on any control failure)
        run: uv run pytest compliance --compliance-results=out/compliance-results.json
      - name: Red-team corpus
        if: always()
        run: uv run python -m assurance_kit.redteam --out out/redteam-report.json
      - name: Evidence pack
        if: always()
        run: uv run python assure.py --out out/evidence-pack --strict
      - name: Keep the evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-${{ github.sha }}
          path: labs/lab6_continuous-compliance/solution/out/
          retention-days: 90
